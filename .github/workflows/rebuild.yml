# Rebuilds the live site every morning at about 9:15 AM Pacific, so an article
# scheduled for that day is saved as its own page and added to the sitemap
# (see scripts/prerender.mjs). Needs the VERCEL_DEPLOY_HOOK secret: a Deploy Hook
# made in Vercel (Settings, Git, Deploy Hooks, branch main). Run it by hand
# from the Actions tab with "Run workflow".
name: Daily site rebuild
on:
  schedule:
    - cron: '15 17 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "VERCEL_DEPLOY_HOOK is not set yet, so nothing was rebuilt."
            exit 0
          fi
          curl -fsS --retry 3 --retry-delay 20 -X POST "$HOOK" > /dev/null
          echo "Rebuild started."
