# Sends the day's payment reminders (api/_lib/reminders.js) at about 9 AM
# Pacific. Run it by hand from the Actions tab with "Run workflow".
name: Payment reminders
on:
  schedule:
    - cron: '0 16 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS --retry 3 --retry-delay 20 'https://linocondigital.com/api/portal?op=reminders'
